name: quantstock1-test

services:
  db:
    image: timescale/timescaledb:2.28.3-pg16
    environment:
      POSTGRES_DB: quantstock1_test
      POSTGRES_USER: quantstock1_test
      POSTGRES_PASSWORD: test_password_only
    volumes:
      - quantstock1_test_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantstock1_test -d quantstock1_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      QUANTSTOCK1_DATABASE_URL: postgresql+psycopg://quantstock1_test:test_password_only@db:5432/quantstock1_test
      QUANTSTOCK1_ENV: test
    ports:
      - "127.0.0.1:18001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quantstock1_test_pgdata:
